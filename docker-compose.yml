# Solo para desarrollo local. En producción se despliega el Dockerfile.
services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - FLASK_APP=app:create_app
    volumes:
      - .:/app
      - ./data:/app/data
    entrypoint: ["sh", "docker-entrypoint.sh"]
    command: flask run --host 0.0.0.0 --port 8000 --debug
